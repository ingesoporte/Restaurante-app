name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Build Web Assets
      run: |
        npm install -g @capacitor/cli @capacitor/core
        mkdir www
        cat << 'EOF' > www/index.html
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Restaurante Control</title>
          <style>
            body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
            .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
            button { background: #ff9800; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; }
          </style>
        </head>
        <body>
          <h2>🍽 Control de Restaurante</h2>
          <div class="card">
            <h3>Ventas Hoy</h3>
            <p style="font-size: 1.5rem; color: #4caf50;">$0</p>
          </div>
          <button onclick="alert('App cargada correctamente')">+ Cargar Almuerzo</button>
        </body>
        </html>
        EOF

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Init Capacitor Android
      run: |
        npx cap init "Restaurante" "com.restaurante.app" --web-dir www
        npm install @capacitor/android
        npx cap add android
        npx cap copy android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Restaurante-Control-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
